<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港獨立書店地圖 & 網店</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- 導航欄 -->
  <header class="bg-amber-900 text-amber-50 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('map')">
        <i class="fa-solid fa-book-bookmark text-2xl text-amber-400"></i>
        <h1 class="text-xl font-bold tracking-wide">香港書店地圖</h1>
      </div>
      <!-- 移動端與桌面端通用的分頁按鈕 -->
      <nav class="flex space-x-3 text-xs sm:text-sm font-medium">
        <button onclick="switchTab('map')" class="hover:text-amber-300 transition bg-amber-950/40 px-2 py-1 rounded">🗺️ 書店地圖</button>
        <button onclick="switchTab('directory')" class="hover:text-amber-300 transition bg-amber-950/40 px-2 py-1 rounded">📚 文化檔案</button>
        <button onclick="switchTab('shop')" class="hover:text-amber-300 transition bg-amber-950/40 px-2 py-1 rounded">🛒 網上商店</button>
      </nav>
      <div class="relative cursor-pointer" onclick="switchTab('shop')">
        <i class="fa-solid fa-cart-shopping text-xl hover:text-amber-300"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- TAB 1: 書店地圖 -->
    <section id="tab-map" class="tab-content active">
      <div class="mb-6">
        <h2 class="text-2xl font-bold mb-2">香港獨立書店名冊</h2>
        <p class="text-slate-600 text-sm">點擊地區標籤篩選實體獨立書店。</p>
      </div>

      <div class="flex flex-wrap gap-2 mb-6">
        <button onclick="filterRegion('ALL')" class="bg-amber-900 text-white px-4 py-1.5 rounded-full text-sm font-medium">全部區域</button>
        <button onclick="filterRegion('香港島')" class="bg-white hover:bg-amber-100 text-slate-700 px-4 py-1.5 rounded-full text-sm font-medium border">香港島</button>
        <button onclick="filterRegion('九龍')" class="bg-white hover:bg-amber-100 text-slate-700 px-4 py-1.5 rounded-full text-sm font-medium border">九龍</button>
        <button onclick="filterRegion('新界')" class="bg-white hover:bg-amber-100 text-slate-700 px-4 py-1.5 rounded-full text-sm font-medium border">新界</button>
        <button onclick="filterRegion('離島')" class="bg-white hover:bg-amber-100 text-slate-700 px-4 py-1.5 rounded-full text-sm font-medium border">離島</button>
      </div>

      <div id="bookshop-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-slate-400 italic col-span-full">資料載入中...</p>
      </div>
    </section>

    <!-- TAB 2: 文化檔案 -->
    <section id="tab-directory" class="tab-content">
      <h2 class="text-2xl font-bold mb-4">作者 & 出版社目錄</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <h3 class="font-bold text-lg mb-3 border-b pb-2 text-amber-900"><i class="fa-solid fa-pen-nib mr-2"></i>獨立作者</h3>
          <div id="author-list" class="space-y-2 text-sm text-slate-600"><p class="text-slate-400 italic">暫無作者資料</p></div>
        </div>
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <h3 class="font-bold text-lg mb-3 border-b pb-2 text-amber-900"><i class="fa-solid fa-building-columns mr-2"></i>獨立出版社</h3>
          <div id="publisher-list" class="space-y-2 text-sm text-slate-600"><p class="text-slate-400 italic">暫無出版社資料</p></div>
        </div>
      </div>
    </section>

    <!-- TAB 3: 網上商店 -->
    <section id="tab-shop" class="tab-content">
      <div class="mb-6"><h2 class="text-2xl font-bold">網上選購</h2></div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-6" id="product-list">
          <p class="text-slate-400 italic col-span-full">商品載入中...</p>
        </div>
        <!-- 購物車 -->
        <div class="bg-white p-6 rounded-xl border shadow-sm h-fit sticky top-20">
          <h3 class="font-bold text-lg mb-4 border-b pb-2 text-amber-900"><i class="fa-solid fa-basket-shopping mr-2"></i>購物車</h3>
          <div id="cart-items" class="text-sm space-y-3 mb-4 text-slate-600 max-h-48 overflow-y-auto">
            <p class="text-slate-400 italic">購物車是空的</p>
          </div>
          <div class="border-t pt-3 mb-4 flex justify-between font-bold text-lg">
            <span>總金額：</span><span id="cart-total" class="text-amber-900">HK$ 0</span>
          </div>
          <div class="space-y-3">
            <input type="text" id="cust-name" class="w-full border rounded px-3 py-1.5 text-sm" placeholder="顧客姓名 *">
            <input type="text" id="cust-phone" class="w-full border rounded px-3 py-1.5 text-sm" placeholder="聯絡電話 *">
            <select id="payment-method" class="w-full border rounded px-3 py-1.5 text-sm">
              <option value="FPS">轉數快 (FPS)</option>
              <option value="PayMe">PayMe</option>
            </select>
            <button onclick="submitOrder()" class="w-full bg-emerald-700 text-white font-medium py-2 rounded-lg hover:bg-emerald-600 text-sm">提交訂單</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-slate-800 text-slate-400 text-xs py-6 text-center mt-auto">
    <p>© 香港獨立書店地圖</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://yteeedyldfemxmvvylem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZWVlZHlsZGZlbXhtdnZ5bGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTI3MzUsImV4cCI6MjEwMzkyODczNX0.Ri7wQQpUJMvqs44jixOD1rU7cP2vt-dKQmSIhrDKAdE';
    
    // 修正 Supabase 初始化寫法
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allBookshops = [];
    let cart = [];

    window.onload = function() {
      fetchBookshops();
      fetchProducts();
      fetchAuthorsAndPublishers();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    async function fetchBookshops() {
      const { data, error } = await _supabase.from('bookshops').select('*').order('id', { ascending: true });
      if (error) {
        console.error(error);
        document.getElementById('bookshop-list').innerHTML = `<p class="text-red-500 col-span-full">載入失敗，請檢查資料庫連線。</p>`;
        return;
      }
      allBookshops = data || [];
      renderBookshops(allBookshops);
    }

    function renderBookshops(list) {
      const container = document.getElementById('bookshop-list');
      if (list.length === 0) {
        container.innerHTML = `<p class="text-slate-400 italic col-span-full">暫無書店紀錄。請先於管理員後台 (admin.html) 新增書店。</p>`;
        return;
      }
      container.innerHTML = list.map(shop => `
        <div class="bg-white rounded-xl shadow-sm border p-5 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg">${shop.name}</h3>
              <span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full">${shop.region}</span>
            </div>
            <p class="text-xs text-slate-500 mb-3"><i class="fa-solid fa-location-dot mr-1"></i>${shop.address || '無地址'}</p>
            <p class="text-sm text-slate-600 mb-4">${shop.description || ''}</p>
          </div>
          <div class="flex justify-between items-center text-xs pt-3 border-t">
            <span class="text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${shop.opening_hours || '未提供'}</span>
            ${shop.google_map_url ? `<a href="${shop.google_map_url}" target="_blank" class="text-amber-800 font-semibold">地圖 ↗</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterRegion(region) {
      if (region === 'ALL') renderBookshops(allBookshops);
      else renderBookshops(allBookshops.filter(b => b.region === region));
    }

    async function fetchProducts() {
      const { data } = await _supabase.from('shop_products').select('*');
      const container = document.getElementById('product-list');
      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-400 italic col-span-full">暫無商品上架。</p>`;
        return;
      }
      container.innerHTML = data.map(item => `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between">
          <div class="h-40 bg-slate-100 flex items-center justify-center">
            ${item.image_url ? `<img src="${item.image_url}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-book text-3xl text-slate-300"></i>`}
          </div>
          <div class="p-4">
            <h3 class="font-bold text-base mb-1">${item.name}</h3>
            <p class="text-amber-900 font-bold mb-3">HK$ ${item.price}</p>
            <button onclick="addToCart('${item.name}',${item.price})" class="w-full bg-amber-900 text-white text-sm py-2 rounded-lg">加入購物車</button>
          </div>
        </div>
      `).join('');
    }

    async function fetchAuthorsAndPublishers() {
      const { data: authors } = await _supabase.from('authors').select('*');
      const { data: publishers } = await _supabase.from('publishers').select('*');
      
      if(authors && authors.length > 0) {
        document.getElementById('author-list').innerHTML = authors.map(a => `<p>• <strong>${a.name}</strong> - ${a.bio || ''}</p>`).join('');
      }
      if(publishers && publishers.length > 0) {
        document.getElementById('publisher-list').innerHTML = publishers.map(p => `<p>• <strong>${p.name}</strong> - ${p.description || ''}</p>`).join('');
      }
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const cartContainer = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartContainer.innerHTML = `<p class="text-slate-400 italic">購物車是空的</p>`;
        document.getElementById('cart-total').innerText = `HK$ 0`;
        return;
      }
      let total = 0;
      cartContainer.innerHTML = cart.map((item, idx) => {
        total += item.price;
        return `<div class="flex justify-between text-xs"><span>${item.name}</span><span class="font-bold">HK$ ${item.price}</span></div>`;
      }).join('');
      document.getElementById('cart-total').innerText = `HK$ ${total}`;
    }

    async function submitOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const method = document.getElementById('payment-method').value;

      if (!name || !phone || cart.length === 0) return alert("請填寫資料並確保購物車有商品！");

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const orderNo = 'ORD-' + Date.now();

      const { error } = await _supabase.from('shop_orders').insert([{
        order_no: orderNo, customer_name: name, customer_phone: phone, payment_method: method, total_amount: total, items_json: cart
      }]);

      if (error) alert("下單失敗：" + error.message);
      else {
        alert(`✅ 下單成功！單號：${orderNo}\n請使用 ${method} 完成付款。`);
        cart = []; updateCartUI();
      }
    }
  </script>
</body>
</html>
