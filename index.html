<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獨立書店地圖與文化檔案</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet 地圖 CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    #map { height: 500px; width: 100%; z-index: 1; }
    .tab-btn.active { border-bottom: 2px solid #78350f; color: #78350f; font-weight: bold; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-amber-950 text-amber-50 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-book-bookmark text-amber-400 text-xl"></i>
        <h1 class="text-xl font-bold tracking-wide">香港獨立書店地圖</h1>
      </div>
      <a href="admin.html" class="text-xs bg-amber-800 hover:bg-amber-700 text-amber-100 px-3 py-1.5 rounded transition">
        <i class="fa-solid fa-lock mr-1"></i>後台管理
      </a>
    </div>
  </header>

  <!-- 主要內容區塊 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-10">

    <!-- 區塊一：獨立書店互動地圖 -->
    <section class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
      <div class="p-4 bg-amber-900/5 border-b border-stone-200 flex justify-between items-center">
        <h2 class="text-lg font-bold text-amber-950 flex items-center gap-2">
          <i class="fa-solid fa-map-location-dot text-amber-700"></i> 書店探索地圖
        </h2>
        <span class="text-xs text-stone-500">點擊地標查看書店詳情</span>
      </div>
      <div id="map"></div>
    </section>

    <!-- 區塊二：文化檔案專區 -->
    <section class="bg-white rounded-xl shadow-sm border border-stone-200 p-6">
      <div class="border-b border-stone-200 pb-3 mb-6">
        <h2 class="text-xl font-bold text-amber-950 flex items-center gap-2">
          <i class="fa-solid fa-box-archive text-amber-700"></i> 文化檔案庫
        </h2>
        <p class="text-xs text-stone-500 mt-1">探索獨立書店文化、出版紀錄與藏書清單</p>
      </div>

      <!-- 分頁頁籤 -->
      <div class="flex border-b border-stone-200 mb-6 gap-6 text-sm">
        <button onclick="switchTab('all')" class="tab-btn active pb-2" id="tab-all">全部檔案</button>
        <button onclick="switchTab('zines')" class="tab-btn pb-2" id="tab-zines">小誌/刊物</button>
        <button onclick="switchTab('history')" class="tab-btn pb-2" id="tab-history">歷史文獻</button>
      </div>

      <!-- 檔案列表卡片容器 -->
      <div id="archive-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-8 text-stone-400">載入中...</div>
      </div>
    </section>

    <!-- 區塊三：周邊選購與 FPS QR Code 結帳 -->
    <section class="bg-white rounded-xl shadow-sm border border-stone-200 p-6">
      <div class="border-b border-stone-200 pb-3 mb-6">
        <h2 class="text-xl font-bold text-amber-950 flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-amber-700"></i> 支持與選購
        </h2>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- 左側：填寫訂單資訊 -->
        <form id="checkout-form" class="space-y-4" onsubmit="handleCheckout(event)">
          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">訂購項目</label>
            <select id="item-select" class="w-full p-2.5 border border-stone-300 rounded-lg text-sm bg-stone-50" onchange="updateTotal()">
              <option value="120">獨立書店漫遊手冊 (Zine Set) - HK$ 120</option>
              <option value="60">香港獨立書店地圖摺頁 - HK$ 60</option>
              <option value="180">文化檔案組合包 - HK$ 180</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">訂購人姓名</label>
            <input type="text" id="cust-name" required placeholder="例如: 陳大文" class="w-full p-2 border border-stone-300 rounded-lg text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">聯絡 Email</label>
            <input type="email" id="cust-email" required placeholder="example@email.com" class="w-full p-2 border border-stone-300 rounded-lg text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-stone-600 mb-1">付款方式</label>
            <div class="p-3 border border-amber-200 bg-amber-50 rounded-lg text-xs text-amber-900">
              <i class="fa-solid fa-qrcode mr-1"></i> 轉數快 FPS / PayMe QR Code 轉帳
            </div>
          </div>

          <div class="pt-2 flex justify-between items-center">
            <span class="text-sm font-bold">應付金額：<span id="total-price" class="text-amber-800 text-lg">HK$ 120</span></span>
            <button type="submit" class="bg-amber-900 hover:bg-amber-800 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition">
              確認訂單並進行付款
            </button>
          </div>
        </form>

        <!-- 右側：付款指示與核對碼顯示區 -->
        <div id="payment-box" class="bg-stone-50 border border-stone-200 rounded-xl p-6 flex flex-col items-center justify-center text-center">
          <div id="payment-placeholder">
            <i class="fa-solid fa-receipt text-4xl text-stone-300 mb-2"></i>
            <p class="text-sm text-stone-500">請在左側選擇項目並送出訂單<br>此處將生成付款 QR Code 及專屬核對碼</p>
          </div>

          <div id="payment-details" class="hidden w-full space-y-4">
            <div class="inline-block p-2 bg-white rounded-lg border border-stone-300 shadow-sm">
              <!-- 示例 QR Code 圖檔，可替換為你的 FPS 二維碼 -->
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=FPS_TEST_PAYMENT" alt="FPS QR Code" class="w-40 h-40">
            </div>
            <div>
              <p class="text-xs text-stone-500">轉數快 ID (FPS ID): <strong class="text-stone-800">123456789</strong></p>
              <div class="mt-2 p-3 bg-amber-100 border border-amber-300 rounded-lg">
                <p class="text-xs text-amber-900 font-semibold">⚠️ 請於轉帳備註填寫以下核對碼：</p>
                <p id="ref-code-display" class="text-xl font-mono font-bold text-amber-950 my-1">BK-8888</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // 初始化 Supabase
    const SUPABASE_URL = 'https://yteeedyldfemxmvvylem.supabase.co';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; // 請替換為你的 Supabase Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. 初始化 Leaflet 地圖
    const map = L.map('map').setView([22.3193, 114.1694], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 預設書店地標數據
    const bookstores = [
      { name: "序言書室", lat: 22.3193, lng: 114.1694, address: "旺角西洋菜南街68號7字樓" },
      { name: "藝壺書店", lat: 22.2825, lng: 114.1290, address: "堅尼地城" }
    ];

    bookstores.forEach(b => {
      L.marker([b.lat, b.lng]).addTo(map)
        .bindPopup(`<b>${b.name}</b><br><span class="text-xs text-stone-600">${b.address}</span>`);
    });

    // 2. 文化檔案動態切換
    const archives = [
      { title: "香港獨立書店誌 Vol.1", category: "zines", desc: "記錄各大獨立書店的獨特風格與創辦故事。" },
      { title: "二樓書店歷史文獻輯錄", category: "history", desc: "整理 80-90 年代旺角二樓書店發展脈絡。" }
    ];

    function renderArchives(filter = 'all') {
      const grid = document.getElementById('archive-grid');
      const filtered = filter === 'all' ? archives : archives.filter(a => a.category === filter);
      
      grid.innerHTML = filtered.map(a => `
        <div class="border border-stone-200 rounded-lg p-4 bg-stone-50 hover:shadow-md transition">
          <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-100 text-amber-800">${a.category}</span>
          <h3 class="font-bold text-amber-950 mt-2">${a.title}</h3>
          <p class="text-xs text-stone-600 mt-1">${a.desc}</p>
        </div>
      `).join('');
    }

    function switchTab(cat) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${cat}`).classList.add('active');
      renderArchives(cat);
    }

    function updateTotal() {
      const val = document.getElementById('item-select').value;
      document.getElementById('total-price').innerText = `HK$ ${val}`;
    }

    // 3. 處理結帳提交
    async function handleCheckout(e) {
      e.preventDefault();
      const refCode = 'BK-' + Math.floor(1000 + Math.random() * 9000);
      
      document.getElementById('payment-placeholder').classList.add('hidden');
      document.getElementById('payment-details').classList.remove('hidden');
      document.getElementById('ref-code-display').innerText = refCode;

      alert(`訂單已建立！請使用轉數快轉帳並備註核對碼：${refCode}`);
    }

    // 初始化頁面
    renderArchives('all');
  </script>
</body>
</html>
