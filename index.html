<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港獨立書店地圖 & 文化社區</title>

  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 載入 Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 載入 Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- 1. 頂部導航欄 -->
  <header class="bg-amber-900 text-amber-50 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">

      <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('map')">
        <i class="fa-solid fa-book-bookmark text-2xl text-amber-400"></i>
        <h1 class="text-lg font-bold tracking-wide">香港書店地圖</h1>
      </div>

      <nav class="flex flex-wrap gap-1.5 text-xs sm:text-sm font-medium">
        <button onclick="switchTab('map')" class="hover:text-amber-300 bg-amber-950/40 px-2.5 py-1.5 rounded-lg transition">🗺️ 書店地圖</button>
        <button onclick="switchTab('directory')" class="hover:text-amber-300 bg-amber-950/40 px-2.5 py-1.5 rounded-lg transition">📚 文化檔案</button>
        <button onclick="switchTab('shop')" class="hover:text-amber-300 bg-amber-950/40 px-2.5 py-1.5 rounded-lg transition">🛒 網上商店</button>
        <button onclick="switchTab('eco')" class="hover:text-amber-300 bg-amber-950/40 px-2.5 py-1.5 rounded-lg transition">🌱 農業/環保</button>
        <button onclick="switchTab('theatre')" class="hover:text-amber-300 bg-amber-950/40 px-2.5 py-1.5 rounded-lg transition">🎭 劇團</button>
      </nav>

      <div class="relative cursor-pointer" onclick="goToCartCheckout()">
        <i class="fa-solid fa-cart-shopping text-xl hover:text-amber-300 transition"></i>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
      </div>

    </div>
  </header>

  <!-- 頁面主體內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- Tab 1: 書店地圖 / 名冊區塊 -->
    <section id="tab-map" class="tab-content active">
      <div class="mb-6">
        <h2 class="text-2xl font-bold mb-2">香港獨立書店名冊</h2>
        <p class="text-slate-600 text-sm">點擊地區標籤篩選實體獨立書店、海外香港書店與圖書館。</p>
      </div>

      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="filterRegion('ALL')" class="bg-amber-900 text-white px-3 py-1.5 rounded-full text-xs font-medium transition">全部區域</button>
        <button onclick="filterRegion('香港島')" class="bg-white hover:bg-amber-100 px-3 py-1.5 rounded-full text-xs font-medium border transition">香港島</button>
        <button onclick="filterRegion('九龍')" class="bg-white hover:bg-amber-100 px-3 py-1.5 rounded-full text-xs font-medium border transition">九龍</button>
        <button onclick="filterRegion('新界')" class="bg-white hover:bg-amber-100 px-3 py-1.5 rounded-full text-xs font-medium border transition">新界</button>
        <button onclick="filterRegion('離島')" class="bg-white hover:bg-amber-100 px-3 py-1.5 rounded-full text-xs font-medium border transition">離島</button>
        <button onclick="filterRegion('外國香港書店/圖書館')" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-3 py-1.5 rounded-full text-xs font-semibold border border-amber-300 transition">🌐 外國香港書店/圖書館</button>
        <button onclick="filterRegion('已結業書店')" class="bg-slate-200 hover:bg-slate-300 text-slate-600 px-3 py-1.5 rounded-full text-xs font-medium transition">🕯️ 已結業書店</button>
      </div>

      <div id="country-filter-bar" class="hidden bg-amber-50 p-3 rounded-xl border border-amber-200 mb-6 flex flex-wrap items-center gap-2 text-xs">
        <span class="font-bold text-amber-900 mr-2"><i class="fa-solid fa-globe mr-1"></i>按國家篩選：</span>
        <button onclick="filterCountry('ALL_OVERSEAS')" class="bg-amber-800 text-white px-2.5 py-1 rounded">全部國家</button>
        <button onclick="filterCountry('英國')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇬🇧 英國</button>
        <button onclick="filterCountry('台灣')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇹🇼 台灣</button>
        <button onclick="filterCountry('加拿大')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇨🇦 加拿大</button>
        <button onclick="filterCountry('澳洲')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇦🇺 澳洲</button>
        <button onclick="filterCountry('日本')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇯🇵 日本</button>
        <button onclick="filterCountry('美國')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇺🇸 美國</button>
        <button onclick="filterCountry('德國')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇩🇪 德國</button>
        <button onclick="filterCountry('泰國')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇹🇭 泰國</button>
        <button onclick="filterCountry('荷蘭')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇳🇱 荷蘭</button>
        <button onclick="filterCountry('馬來西亞')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇲🇾 馬來西亞</button>
        <button onclick="filterCountry('新加坡')" class="bg-white border px-2 py-1 rounded hover:bg-amber-100">🇸🇬 新加坡</button>
      </div>

      <div id="bookshop-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-slate-400 italic col-span-full">載入資料中...</p>
      </div>
    </section>

    <!-- Tab 2: 作者 & 出版社目錄 -->
    <section id="tab-directory" class="tab-content">
      <h2 class="text-2xl font-bold mb-4">作者 & 出版社目錄</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <h3 class="font-bold text-lg mb-4 border-b pb-2 text-amber-900"><i class="fa-solid fa-pen-nib mr-2"></i>獨立作者</h3>
          <div id="author-list" class="space-y-4 text-sm text-slate-600"><p class="text-slate-400 italic">暫無作者資料</p></div>
        </div>
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <h3 class="font-bold text-lg mb-4 border-b pb-2 text-amber-900"><i class="fa-solid fa-building-columns mr-2"></i>獨立出版社</h3>
          <div id="publisher-list" class="space-y-4 text-sm text-slate-600"><p class="text-slate-400 italic">暫無出版社資料</p></div>
        </div>
      </div>
    </section>

    <!-- Tab 3: 網上商店 -->
    <section id="tab-shop" class="tab-content">
      <div class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b pb-4">
        <h2 class="text-2xl font-bold">網上選購</h2>
        
        <div class="flex items-center space-x-2">
          <label for="category-select" class="text-xs sm:text-sm font-semibold text-slate-700 whitespace-nowrap">書籍主題 (分類)：</label>
          <select id="category-select" onchange="filterProductCategory(this.value)" class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-800 shadow-sm cursor-pointer">
            <option value="ALL">📖 全部主題</option>
            <option value="文學小說">📖 文學小說</option>
            <option value="心理勵志">🧠 心理勵志</option>
            <option value="人文社科">🏛️ 人文社科</option>
            <option value="藝術設計">🎨 藝術設計</option>
            <option value="生活風格">🌱 生活風格</option>
            <option value="文創周邊">🎁 文創周邊</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-6" id="product-list">
          <p class="text-slate-400 italic col-span-full">載入商品中...</p>
        </div>
        
        <!-- 購物車結帳側邊欄 -->
        <div id="checkout-sidebar" class="bg-white p-6 rounded-xl border shadow-sm h-fit sticky top-20">
          <h3 class="font-bold text-lg mb-4 border-b pb-2 text-amber-900"><i class="fa-solid fa-basket-shopping mr-2"></i>購物車內容</h3>
          <div id="cart-items" class="text-sm space-y-3 mb-4 text-slate-600"><p class="text-slate-400 italic">購物車目前是空的</p></div>
          <div class="border-t pt-3 mb-4 flex justify-between font-bold text-lg">
            <span>總金額：</span><span id="cart-total" class="text-amber-900">HK$ 0</span>
          </div>
          <div class="space-y-3">
            <input type="text" id="cust-name" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-amber-800" placeholder="顧客姓名 *">
            <input type="text" id="cust-phone" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-amber-800" placeholder="聯絡電話 *">
            <select id="payment-method" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-amber-800">
              <option value="FPS">轉數快 (FPS)</option>
              <option value="PayMe">PayMe</option>
            </select>
            <button onclick="submitOrder()" class="w-full bg-emerald-700 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-600 transition text-sm">提交訂單</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 4: 農業 & 環保綠色地圖 -->
    <section id="tab-eco" class="tab-content">
      <div class="mb-6">
        <h2 class="text-2xl font-bold mb-2">香港農業 & 環保綠色地圖</h2>
        <p class="text-slate-600 text-sm">探索本地大自然教育平台、農地與綠色回收站。</p>
      </div>
      
      <div class="flex flex-wrap gap-2 mb-6">
        <button onclick="filterEco('ALL')" class="bg-emerald-800 text-white px-3 py-1 rounded-full text-xs font-medium transition">全部分類</button>
        <button onclick="filterEco('平台/大自然/教育')" class="bg-white border px-3 py-1 rounded-full text-xs hover:bg-emerald-50 transition">🌿 平台/大自然/教育</button>
        <button onclick="filterEco('農地')" class="bg-white border px-3 py-1 rounded-full text-xs hover:bg-emerald-50 transition">👨‍🌾 農地</button>
        <button onclick="filterEco('回收/環保')" class="bg-white border px-3 py-1 rounded-full text-xs hover:bg-emerald-50 transition">♻️ 回收/環保</button>
      </div>

      <div id="eco-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-slate-400 italic col-span-full">載入資料中...</p>
      </div>
    </section>

    <!-- Tab 5: 劇團名冊 -->
    <section id="tab-theatre" class="tab-content">
      <div class="mb-6">
        <h2 class="text-2xl font-bold mb-2">香港本地劇團名冊</h2>
        <p class="text-slate-600 text-sm">支持本地獨立劇團與表演藝術團體。</p>
      </div>

      <div class="flex flex-wrap gap-2 mb-6">
        <button onclick="filterTheatre('ALL')" class="bg-purple-900 text-white px-3 py-1 rounded-full text-xs font-medium transition">全部地區</button>
        <button onclick="filterTheatre('香港島')" class="bg-white border px-3 py-1 rounded-full text-xs hover:bg-purple-50 transition">香港島</button>
        <button onclick="filterTheatre('九龍')" class="bg-white border px-3 py-1 rounded-full text-xs hover:bg-purple-50 transition">九龍</button>
        <button onclick="filterTheatre('新界')" class="bg-white border px-3 py-1 rounded-full text-xs hover:bg-purple-50 transition">新界</button>
      </div>

      <div id="theatre-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-slate-400 italic col-span-full">載入資料中...</p>
      </div>
    </section>

  </main>

  <footer class="bg-slate-800 text-slate-400 text-xs py-6 text-center mt-auto">
    <p>© 香港獨立書店地圖 & 文化社區</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://yteeedyldfemxmvvylem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZWVlZHlsZGZlbXhtdnZ5bGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTI3MzUsImV4cCI6MjEwMzkyODczNX0.Ri7wQQpUJMvqs44jixOD1rU7cP2vt-dKQmSIhrDKAdE';
    
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allBookshops = [], allEco = [], allTheatre = [], allProducts = [], cart = [];

    const categoryIcons = {
      '文學小說': '📖',
      '心理勵志': '🧠',
      '人文社科': '🏛️',
      '藝術設計': '🎨',
      '生活風格': '🌱',
      '文創周邊': '🎁',
      '其他': '📚'
    };

    function cleanCategory(str) {
      if (!str) return '其他';
      return str.replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();
    }

    window.onload = function() {
      fetchBookshops();
      fetchProducts();
      fetchAuthorsAndPublishers();
      fetchEco();
      fetchTheatre();
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function goToCartCheckout() {
      switchTab('shop');
      setTimeout(() => {
        document.getElementById('checkout-sidebar').scrollIntoView({ behavior: 'smooth' });
      }, 50);
    }

    // --- 書店 ---
    async function fetchBookshops() {
      const { data } = await _supabase.from('bookshops').select('*').order('id', { ascending: true });
      allBookshops = data || [];
      renderBookshops(allBookshops);
    }

    function renderBookshops(list) {
      const container = document.getElementById('bookshop-list');
      if (list.length === 0) { container.innerHTML = `<p class="text-slate-400 italic col-span-full">暫無紀錄。</p>`; return; }
      container.innerHTML = list.map(shop => `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          ${shop.image_url ? `<div class="h-44 bg-slate-50 flex items-center justify-center overflow-hidden"><img src="${shop.image_url}" class="w-full h-full object-contain p-2"></div>` : ''}
          <div class="p-5 flex-grow">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-slate-800">${shop.name}</h3>
              <span class="bg-amber-100 text-amber-900 text-xs px-2.5 py-0.5 rounded-full font-semibold">
                ${shop.region === '外國香港書店/圖書館' ? (shop.country || '海外') : shop.region}
              </span>
            </div>
            <p class="text-xs text-slate-500 mb-1"><i class="fa-solid fa-location-dot mr-1 text-amber-800"></i>${shop.address || '無地址'}</p>
            ${shop.phone ? `<p class="text-xs text-slate-500 mb-2"><i class="fa-solid fa-phone mr-1 text-amber-800"></i>${shop.phone}</p>` : ''}
            <p class="text-xs text-slate-400 mb-3"><i class="fa-regular fa-clock mr-1"></i>${shop.opening_hours || '未提供營業時間'}</p>
            <p class="text-sm text-slate-600 mb-4 line-clamp-3">${shop.description || ''}</p>
          </div>
          <div class="px-5 py-3 bg-slate-50 border-t flex justify-between items-center text-xs">
            <div class="flex space-x-3 text-slate-600 text-base">
              ${shop.instagram_url ? `<a href="${shop.instagram_url}" target="_blank" class="hover:text-pink-600 transition"><i class="fa-brands fa-instagram"></i></a>` : ''}
              ${shop.facebook_url ? `<a href="${shop.facebook_url}" target="_blank" class="hover:text-blue-600 transition"><i class="fa-brands fa-facebook"></i></a>` : ''}
            </div>
            ${shop.google_map_url ? `<a href="${shop.google_map_url}" target="_blank" class="text-amber-900 font-bold hover:underline">Google Map ↗</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterRegion(region) {
      document.getElementById('country-filter-bar').classList.toggle('hidden', region !== '外國香港書店/圖書館');
      if (region === 'ALL') renderBookshops(allBookshops);
      else renderBookshops(allBookshops.filter(b => b.region === region));
    }

    function filterCountry(country) {
      if (country === 'ALL_OVERSEAS') renderBookshops(allBookshops.filter(b => b.region === '外國香港書店/圖書館'));
      else renderBookshops(allBookshops.filter(b => b.region === '外國香港書店/圖書館' && b.country === country));
    }

    // --- 作者 & 出版社 ---
    async function fetchAuthorsAndPublishers() {
      const { data: authors } = await _supabase.from('authors').select('*');
      const { data: publishers } = await _supabase.from('publishers').select('*');

      const authorContainer = document.getElementById('author-list');
      if (authors && authors.length > 0) {
        authorContainer.innerHTML = authors.map(a => `
          <div class="border-b pb-3 flex space-x-3">
            ${a.image_url ? `<img src="${a.image_url}" class="w-12 h-12 rounded-full object-cover">` : ''}
            <div>
              <h4 class="font-bold text-slate-800">${a.name}</h4>
              <p class="text-xs text-slate-500">${a.bio || ''}</p>
            </div>
          </div>
        `).join('');
      }

      const pubContainer = document.getElementById('publisher-list');
      if (publishers && publishers.length > 0) {
        pubContainer.innerHTML = publishers.map(p => `
          <div class="border-b pb-3 flex space-x-3">
            ${p.image_url ? `<img src="${p.image_url}" class="w-12 h-12 rounded object-cover">` : ''}
            <div>
              <h4 class="font-bold text-slate-800">${p.name}</h4>
              <p class="text-xs text-slate-500">${p.description || ''}</p>
            </div>
          </div>
        `).join('');
      }
    }

    // --- 網上商店 (支援多分店庫存顯示) ---
    async function fetchProducts() {
      const { data } = await _supabase.from('shop_products').select('*').order('id', { ascending: false });
      allProducts = data || [];
      renderProducts(allProducts);
    }

    function renderProducts(list) {
      const container = document.getElementById('product-list');
      if (list.length === 0) { container.innerHTML = `<p class="text-slate-400 italic col-span-full">暫無商品。</p>`; return; }
      
      container.innerHTML = list.map(p => {
        const cleanCat = cleanCategory(p.category);
        const icon = categoryIcons[cleanCat] || '📚';

        // 解析多分店庫存
        let stocks = p.branch_stocks || {};
        if (typeof stocks === 'string') {
          try { stocks = JSON.parse(stocks); } catch(e) { stocks = {}; }
        }
        if (Object.keys(stocks).length === 0 && p.branch) {
          stocks[p.branch] = p.quantity || 0;
        }

        // 生成各分店標籤
        const branchBadges = Object.entries(stocks).map(([b, q]) => `
          <span class="bg-blue-50 text-blue-800 border border-blue-200 px-2 py-0.5 rounded text-[11px] font-medium">
            📍 ${b}: ${q}本
          </span>
        `).join(' ');

        const totalQty = Object.values(stocks).reduce((a, b) => a + Number(b), 0);

        return `
          <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-md transition">
            ${p.image_url ? `<div class="h-48 bg-slate-50 flex items-center justify-center overflow-hidden"><img src="${p.image_url}" class="w-full h-full object-contain p-2"></div>` : ''}
            <div class="p-5 flex-grow">
              <div class="flex justify-between items-start mb-1">
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${icon} ${cleanCat}</span>
                <span class="text-xs font-bold text-amber-900">${p.stock_type || '一般進貨'}</span>
              </div>
              <h3 class="font-bold text-base text-slate-800 mt-2 mb-1">${p.name}</h3>
              ${p.author ? `<p class="text-xs text-slate-500 mb-1">作者：${p.author}</p>` : ''}
              ${p.isbn ? `<p class="text-xs text-slate-400 mb-2">ISBN: ${p.isbn}</p>` : ''}
              
              <!-- 顯示所有存貨分店標籤 -->
              <div class="flex flex-wrap gap-1 my-2">
                ${branchBadges || '<span class="text-xs text-slate-400">暫無分店庫存</span>'}
              </div>

              <p class="text-xs text-slate-600 line-clamp-3 my-2">${p.description || ''}</p>
            </div>
            <div class="p-4 bg-slate-50 border-t flex items-center justify-between">
              <div>
                <span class="text-lg font-bold text-amber-900">HK$${p.price}</span>
                <span class="text-[11px] block ${totalQty > 0 ? 'text-emerald-700 font-semibold' : 'text-red-500 font-semibold'}">
                  ${totalQty > 0 ? `總存貨: ${totalQty}本` : '缺貨中'}
                </span>
              </div>
              <button onclick="addToCart(${p.id})" ${totalQty <= 0 ? 'disabled' : ''} class="bg-amber-900 hover:bg-amber-800 disabled:bg-slate-300 text-white text-xs px-3 py-2 rounded-lg transition font-medium">
                ${totalQty > 0 ? '加入購物車' : '已售罄'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProductCategory(cat) {
      if (cat === 'ALL') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => cleanCategory(p.category) === cleanCategory(cat)));
    }

    function addToCart(id) {
      const product = allProducts.find(p => p.id === id);
      if (!product) return;
      const exist = cart.find(item => item.id === id);
      if (exist) { exist.qty += 1; } else { cart.push({ ...product, qty: 1 }); }
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      countEl.innerText = totalItems;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-slate-400 italic">購物車目前是空的</p>`;
        totalEl.innerText = 'HK$ 0';
        return;
      }

      let totalCost = 0;
      container.innerHTML = cart.map(item => {
        totalCost += item.price * item.qty;
        return `
          <div class="flex justify-between items-center text-xs border-b pb-2">
            <div>
              <p class="font-bold text-slate-800">${item.name}</p>
              <p class="text-slate-500">HK$${item.price} x ${item.qty}</p>
            </div>
            <div class="flex items-center space-x-1">
              <button onclick="changeQty(${item.id}, -1)" class="px-2 py-0.5 bg-slate-200 rounded text-slate-700">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)" class="px-2 py-0.5 bg-slate-200 rounded text-slate-700">+</button>
            </div>
          </div>
        `;
      }).join('');

      totalEl.innerText = `HK$ ${totalCost}`;
    }

    function changeQty(id, delta) {
      const item = cart.find(x => x.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) { cart = cart.filter(x => x.id !== id); }
      updateCartUI();
    }

    async function submitOrder() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const payment = document.getElementById('payment-method').value;

      if (!name || !phone) { alert("請填寫姓名與電話！"); return; }
      if (cart.length === 0) { alert("購物車是空的！"); return; }

      alert(`✅ 訂單已提交！\n感謝 ${name} 的支持，稍後將透過電話 ${phone} 與您確認 ${payment} 付款細節。`);
      cart = [];
      updateCartUI();
      document.getElementById('cust-name').value = '';
      document.getElementById('cust-phone').value = '';
    }

    // --- 農業 & 環保 ---
    async function fetchEco() {
      const { data } = await _supabase.from('eco_farms').select('*');
      allEco = data || [];
      renderEco(allEco);
    }

    function renderEco(list) {
      const container = document.getElementById('eco-list');
      if (list.length === 0) { container.innerHTML = `<p class="text-slate-400 italic col-span-full">暫無農業/環保紀錄。</p>`; return; }
      container.innerHTML = list.map(item => `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          ${item.image_url ? `<div class="h-40 bg-slate-50 flex items-center justify-center overflow-hidden"><img src="${item.image_url}" class="w-full h-full object-contain p-2"></div>` : ''}
          <div class="p-5 flex-grow">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
              <span class="bg-emerald-100 text-emerald-900 text-xs px-2.5 py-0.5 rounded-full font-semibold">${item.category}</span>
            </div>
            <p class="text-xs text-slate-500 mb-1"><i class="fa-solid fa-location-dot mr-1 text-emerald-800"></i>${item.address || '無地址'}</p>
            ${item.phone ? `<p class="text-xs text-slate-500 mb-2"><i class="fa-solid fa-phone mr-1 text-emerald-800"></i>${item.phone}</p>` : ''}
            <p class="text-sm text-slate-600 mb-4">${item.description || ''}</p>
          </div>
          <div class="px-5 py-3 bg-slate-50 border-t flex space-x-3 text-slate-600 text-base">
            ${item.instagram_url ? `<a href="${item.instagram_url}" target="_blank" class="hover:text-pink-600 transition"><i class="fa-brands fa-instagram"></i></a>` : ''}
            ${item.facebook_url ? `<a href="${item.facebook_url}" target="_blank" class="hover:text-blue-600 transition"><i class="fa-brands fa-facebook"></i></a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterEco(cat) {
      if (cat === 'ALL') renderEco(allEco);
      else renderEco(allEco.filter(e => e.category === cat));
    }

    // --- 劇團 ---
    async function fetchTheatre() {
      const { data } = await _supabase.from('theatre_groups').select('*');
      allTheatre = data || [];
      renderTheatre(allTheatre);
    }

    function renderTheatre(list) {
      const container = document.getElementById('theatre-list');
      if (list.length === 0) { container.innerHTML = `<p class="text-slate-400 italic col-span-full">暫無劇團紀錄。</p>`; return; }
      container.innerHTML = list.map(item => `
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          ${item.image_url ? `<div class="h-40 bg-slate-50 flex items-center justify-center overflow-hidden"><img src="${item.image_url}" class="w-full h-full object-contain p-2"></div>` : ''}
          <div class="p-5 flex-grow">
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-slate-800">${item.name}</h3>
              <span class="bg-purple-100 text-purple-900 text-xs px-2.5 py-0.5 rounded-full font-semibold">${item.region}</span>
            </div>
            <p class="text-xs text-slate-500 mb-1"><i class="fa-solid fa-location-dot mr-1 text-purple-800"></i>${item.address || '無地址'}</p>
            ${item.phone ? `<p class="text-xs text-slate-500 mb-2"><i class="fa-solid fa-phone mr-1 text-purple-800"></i>${item.phone}</p>` : ''}
            <p class="text-sm text-slate-600 mb-4">${item.description || ''}</p>
          </div>
          <div class="px-5 py-3 bg-slate-50 border-t flex space-x-3 text-slate-600 text-base">
            ${item.instagram_url ? `<a href="${item.instagram_url}" target="_blank" class="hover:text-pink-600 transition"><i class="fa-brands fa-instagram"></i></a>` : ''}
            ${item.facebook_url ? `<a href="${item.facebook_url}" target="_blank" class="hover:text-blue-600 transition"><i class="fa-brands fa-facebook"></i></a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterTheatre(region) {
      if (region === 'ALL') renderTheatre(allTheatre);
      else renderTheatre(allTheatre.filter(t => t.region === region));
    }
  </script>
</body>
</html>
