<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼｜無所事事小書店</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 text-slate-800">
  <main class="w-full max-w-md">
    <section class="bg-white rounded-2xl border border-slate-200 shadow-lg p-7">
      <div class="text-center mb-7">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-amber-900 text-amber-200 flex items-center justify-center text-2xl shadow">
          <i class="fa-solid fa-key"></i>
        </div>

        <h1 class="text-xl font-bold text-amber-950">
          無所事事小書店
        </h1>

        <p class="mt-1 text-sm text-slate-500">
          設定新密碼
        </p>
      </div>

      <p id="invalid-link" class="hidden text-xs rounded-lg p-3 bg-red-50 text-red-700 border border-red-200">
        呢個重設連結無效或已過期，請返回登入頁重新寄出重設電郵。
      </p>

      <form id="reset-form" class="hidden space-y-4">
        <div>
          <label for="reset-password" class="block text-xs font-bold text-slate-700 mb-1.5">
            新密碼
          </label>
          <input
            id="reset-password"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="最少 8 個字"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-800"
          >
        </div>

        <div>
          <label for="reset-password-confirm" class="block text-xs font-bold text-slate-700 mb-1.5">
            確認新密碼
          </label>
          <input
            id="reset-password-confirm"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="再輸入一次新密碼"
            class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-800"
          >
        </div>

        <p id="reset-message" class="hidden text-xs rounded-lg p-3"></p>

        <button
          id="reset-button"
          type="submit"
          class="w-full bg-amber-900 hover:bg-amber-800 disabled:bg-slate-400 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm"
        >
          <i class="fa-solid fa-check mr-1.5"></i>
          確認重設密碼
        </button>
      </form>

      <p id="done-panel" class="hidden text-center">
        <span class="block text-xs rounded-lg p-3 bg-emerald-50 text-emerald-800 border border-emerald-200 mb-4">
          密碼已重設，請用新密碼登入。
        </span>
        <a href="login.html" class="text-xs text-amber-800 hover:text-amber-900 underline underline-offset-2">
          前往登入頁
        </a>
      </p>

      <a
        href="login.html"
        class="mt-5 block text-center text-xs text-slate-500 hover:text-amber-800"
      >
        <i class="fa-solid fa-arrow-left mr-1"></i>
        返回登入頁
      </a>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://yteeedyldfemxmvvylem.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZWVlZHlsZGZlbXhtdnZ5bGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTI3MzUsImV4cCI6MjEwMzkyODczNX0.Ri7wQQpUJMvqs44jixOD1rU7cP2vt-dKQmSIhrDKAdE';

    const _supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const resetForm = document.getElementById('reset-form');
    const resetButton = document.getElementById('reset-button');
    const resetMessage = document.getElementById('reset-message');
    const invalidLink = document.getElementById('invalid-link');
    const donePanel = document.getElementById('done-panel');

    function showResetMessage(text, type = 'error') {
      resetMessage.textContent = text;
      resetMessage.className =
        type === 'success'
          ? 'text-xs rounded-lg p-3 bg-emerald-50 text-emerald-800 border border-emerald-200'
          : 'text-xs rounded-lg p-3 bg-red-50 text-red-700 border border-red-200';
    }

    let recoveryReady = false;

    function markRecoveryReady() {
      recoveryReady = true;
      resetForm.classList.remove('hidden');
      invalidLink.classList.add('hidden');
    }

    function markInvalid() {
      if (recoveryReady) return;
      invalidLink.classList.remove('hidden');
      resetForm.classList.add('hidden');
    }

    // Supabase 會喺重設連結嘅網址 hash 加入 type=recovery，
    // client 會自動攞到 session 同觸發 PASSWORD_RECOVERY 事件
    _supabase.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') {
        markRecoveryReady();
      }
    });

    // 如果 hash 已經有 access token（例如頁面 reload），檢查埋現有 session
    (async function () {
      if (window.location.hash.includes('type=recovery')) {
        // 等 client 處理 hash；一段時間後冇觸發就當無效
        window.setTimeout(markInvalid, 5000);
        return;
      }

      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        markRecoveryReady();
      } else {
        markInvalid();
      }
    })();

    resetForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const password = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-password-confirm').value;

      if (password.length < 8) {
        showResetMessage('新密碼最少要 8 個字。');
        return;
      }

      if (password !== confirm) {
        showResetMessage('兩次輸入嘅密碼唔一樣，請重新輸入。');
        return;
      }

      const oldHtml = resetButton.innerHTML;

      try {
        resetButton.disabled = true;
        resetButton.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>更新中…';
        resetMessage.className = 'hidden';

        const { error } = await _supabase.auth.updateUser({ password });

        if (error) {
          throw error;
        }

        await _supabase.auth.signOut();

        resetForm.classList.add('hidden');
        donePanel.classList.remove('hidden');
      } catch (error) {
        console.error(error);
        showResetMessage('重設失敗，連結可能已過期，請重新寄出重設電郵。');
      } finally {
        resetButton.disabled = false;
        resetButton.innerHTML = oldHtml;
      }
    });
  </script>
</body>
</html>
