<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獨立書店地圖 - 後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

  <!-- 頂部導覽列 -->
  <header class="bg-amber-950 text-amber-50 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-gear text-amber-400 text-xl"></i>
        <h1 class="text-lg font-bold tracking-wide">後台管理系統</h1>
      </div>
      <a href="index.html" class="text-xs bg-amber-800 hover:bg-amber-700 text-amber-100 px-3 py-1.5 rounded transition">
        返回前台首頁
      </a>
    </div>
  </header>

  <!-- 後台主要內容 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

    <!-- 數據概覽 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs text-slate-500 font-semibold">待核對訂單</p>
        <p class="text-2xl font-bold text-amber-800 mt-1" id="pending-count">2 件</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs text-slate-500 font-semibold">已完成交易</p>
        <p class="text-2xl font-bold text-emerald-700 mt-1">15 件</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs text-slate-500 font-semibold">總獨立書店地標</p>
        <p class="text-2xl font-bold text-slate-800 mt-1">18 間</p>
      </div>
    </div>

    <!-- 訂單對帳與審核表格 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <h2 class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-amber-800"></i> FPS 轉帳審核與對帳列表
        </h2>
        <button onclick="loadOrders()" class="text-xs text-amber-800 hover:underline">
          <i class="fa-solid fa-rotate mr-1"></i> 重新整理
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-semibold uppercase border-b border-slate-200">
            <tr>
              <th class="p-3">核對碼</th>
              <th class="p-3">顧客姓名</th>
              <th class="p-3">金額</th>
              <th class="p-3">狀態</th>
              <th class="p-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y divide-slate-200">
            <!-- 靜態示例數據 -->
            <tr id="row-BK-8821">
              <td class="p-3 font-mono font-bold text-amber-900">BK-8821</td>
              <td class="p-3">陳小明 (ming@example.com)</td>
              <td class="p-3 font-semibold">HK$ 120</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-semibold">待核對</span></td>
              <td class="p-3 text-right space-x-2">
                <button onclick="approveOrder('BK-8821')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-xs">確認收到入數</button>
              </td>
            </tr>
            <tr id="row-BK-7310">
              <td class="p-3 font-mono font-bold text-amber-900">BK-7310</td>
              <td class="p-3">李華 (lee@example.com)</td>
              <td class="p-3 font-semibold">HK$ 60</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold">已確認</span></td>
              <td class="p-3 text-right">
                <span class="text-slate-400">已完成</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    function approveOrder(code) {
      if(confirm(`確認已收到核對碼 ${code} 的轉數快入數？`)) {
        const row = document.getElementById(`row-${code}`);
        if(row) {
          row.querySelector('td:nth-child(4)').innerHTML = '<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold">已確認</span>';
          row.querySelector('td:nth-child(5)').innerHTML = '<span class="text-slate-400">已完成</span>';
        }
      }
    }
  </script>
</body>
</html>
