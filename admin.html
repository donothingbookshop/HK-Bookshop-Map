<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獨立書店地圖 - 後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

  <header class="bg-amber-950 text-amber-50 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-gear text-amber-400 text-xl"></i>
        <h1 class="text-lg font-bold tracking-wide">後台管理系統</h1>
      </div>
      <a href="index.html" class="text-xs bg-amber-800 hover:bg-amber-700 px-3 py-1.5 rounded-lg transition">返回前台首頁 ↗</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-3 items-center">
      <button onclick="switchTab('orders', this)" class="tab-btn active bg-amber-900 text-white px-3.5 py-2 rounded-lg text-xs font-medium transition">📦 訂單管理</button>
      <button onclick="switchTab('manual-receipt', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🧾 手動新增收據</button>
      <button onclick="switchTab('payment-settings', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">💳 收款設定</button>
      <button onclick="switchTab('bookshops', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🏪 實體書店</button>
      <button onclick="switchTab('authors', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">✍️ 本地作者</button>
      <button onclick="switchTab('publishers', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🏛️ 本地出版社</button>
      <button onclick="switchTab('products', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🛒 網店商品</button>
      <button onclick="switchTab('eco', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🌱 農業/環保</button>
      <button onclick="switchTab('theatre', this)" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🎭 劇團</button>
    </div>

    <!-- 訂單管理 -->
    <section id="tab-orders" class="tab-content active">
      <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
          <h3 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-list-check mr-2"></i>顧客訂單記錄</h3>
          <button onclick="fetchOrders()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded transition"><i class="fa-solid fa-rotate-right mr-1"></i>重新整理</button>
        </div>
        <div id="list-orders" class="space-y-3">載入訂單中...</div>
      </div>
    </section>

    <!-- 手動新增收據 -->
    <section id="tab-manual-receipt" class="tab-content">
      <form id="form-manual-receipt" onsubmit="saveManualReceipt(event)" class="bg-white p-6 rounded-xl shadow-sm border max-w-3xl space-y-4 mx-auto">
        <h3 class="font-bold text-lg text-amber-950 border-b pb-2"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>手動新增顧客購買收據</h3>
        <p class="text-xs text-slate-500">此功能可用於現場銷售或手動建立未上架網店的商品收據，完成後會自動存入訂單紀錄。</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">顧客姓名 *</label>
            <input type="text" id="mr-customer-name" required placeholder="例如：張先生 / 現場顧客" class="w-full border rounded px-3 py-1.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">聯絡電話</label>
            <input type="text" id="mr-customer-phone" placeholder="例如：91234567" class="w-full border rounded px-3 py-1.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">付款方式</label>
            <select id="mr-payment-method" class="w-full border rounded px-3 py-1.5 text-sm bg-white">
              <option value="現金">現金</option>
              <option value="FPS">轉數快 (FPS)</option>
              <option value="PayMe">PayMe</option>
              <option value="信用卡">信用卡</option>
              <option value="銀行轉帳">銀行轉帳</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">訂單狀態</label>
            <select id="mr-status" class="w-full border rounded px-3 py-1.5 text-sm bg-white">
              <option value="已完成">已完成</option>
              <option value="已付款">已付款</option>
              <option value="待確認">待確認</option>
            </select>
          </div>
        </div>

        <div class="border-t pt-4">
          <label class="block text-xs font-bold text-slate-700 mb-2">購買項目名稱及金額 (多項請換行輸入)</label>
          <textarea id="mr-items-text" rows="4" required placeholder="例如：&#10;《香港書店誌》 x 1 - $120&#10;《文化探索》 x 2 - $160" class="w-full border rounded p-2 text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">應付/實付總金額 (HK$) *</label>
          <input type="number" id="mr-total-amount" required placeholder="280" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>

        <button type="submit" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-2 rounded text-sm transition">
          建立並儲存收據
        </button>
      </form>
    </section>

    <!-- 收款設定 -->
    <section id="tab-payment-settings" class="tab-content">
      <form id="form-payment-settings" onsubmit="savePaymentSettings(event)" class="bg-white p-6 rounded-xl shadow-sm border max-w-2xl mx-auto space-y-4">
        <h3 class="font-bold text-lg text-amber-950 border-b pb-2"><i class="fa-solid fa-credit-card mr-2"></i>前台付款資訊設定</h3>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">FPS 識別碼 / 電話</label>
          <input type="text" id="ps-fps-number" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">FPS 二維碼圖片 URL</label>
          <input type="url" id="ps-fps-qr-url" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">PayMe 連結</label>
          <input type="url" id="ps-payme-link" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">PayMe 二維碼圖片 URL</label>
          <input type="url" id="ps-payme-qr-url" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">銀行名稱</label>
          <input type="text" id="ps-bank-name" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">銀行戶口號碼</label>
          <input type="text" id="ps-bank-account" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">戶口持有人姓名</label>
          <input type="text" id="ps-bank-holder" class="w-full border rounded px-3 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">額外付款指示 / 備註</label>
          <textarea id="ps-instructions" rows="3" class="w-full border rounded p-2 text-sm"></textarea>
        </div>
        <button type="submit" class="w-full bg-amber-900 hover:bg-amber-800 text-white font-bold py-2 rounded text-sm transition">儲存收款設定</button>
      </form>
    </section>

    <!-- 實體書店 -->
    <section id="tab-bookshops" class="tab-content">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form id="form-bookshop" onsubmit="saveBookshop(event)" class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
          <h3 class="font-bold text-lg border-b pb-2" id="bookshop-form-title">新增實體書店</h3>
          <input type="hidden" id="bs-id">
          <div><label class="text-xs font-medium">書店名稱 *</label><input type="text" id="bs-name" required class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">區域 *</label>
            <select id="bs-region" class="w-full border rounded px-3 py-1 text-sm bg-white">
              <option value="香港島">香港島</option>
              <option value="九龍">九龍</option>
              <option value="新界">新界</option>
              <option value="離島">離島</option>
              <option value="外國香港書店/圖書館">外國香港書店/圖書館</option>
              <option value="已結業書店">已結業書店</option>
            </select>
          </div>
          <div><label class="text-xs font-medium">國家 (如適用)</label><input type="text" id="bs-country" class="w-full border rounded px-3 py-1 text-sm" placeholder="例如：英國、台灣"></div>
          <div><label class="text-xs font-medium">地址</label><input type="text" id="bs-address" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">電話</label><input type="text" id="bs-phone" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">營業時間</label><input type="text" id="bs-opening" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">圖片 URL</label><input type="url" id="bs-image" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Google Map 連結</label><input type="url" id="bs-map" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">網站 URL</label><input type="url" id="bs-website" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Instagram URL</label><input type="url" id="bs-ig" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Facebook URL</label><input type="url" id="bs-fb" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">簡介描述</label><textarea id="bs-desc" rows="3" class="w-full border rounded p-2 text-sm"></textarea></div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-amber-900 text-white font-bold py-2 rounded text-xs">儲存書店</button>
            <button type="button" onclick="resetBookshopForm()" class="bg-slate-200 px-3 py-2 rounded text-xs">取消</button>
          </div>
        </form>
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 border-b pb-2">書店列表</h3>
          <div id="admin-list-bookshops" class="space-y-3">載入中...</div>
        </div>
      </div>
    </section>

    <!-- 本地作者 -->
    <section id="tab-authors" class="tab-content">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form id="form-author" onsubmit="saveAuthor(event)" class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
          <h3 class="font-bold text-lg border-b pb-2" id="author-form-title">新增本地作者</h3>
          <input type="hidden" id="author-id">
          <div><label class="text-xs font-medium">作者姓名 *</label><input type="text" id="author-name" required class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">相片 / 頭像 URL</label><input type="url" id="author-image" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">聯絡電話</label><input type="text" id="author-phone" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">官方網站 URL</label><input type="url" id="author-website" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Instagram URL</label><input type="url" id="author-ig" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Facebook URL</label><input type="url" id="author-fb" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">個人簡介</label><textarea id="author-bio" rows="4" class="w-full border rounded p-2 text-sm"></textarea></div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-amber-900 text-white font-bold py-2 rounded text-xs">儲存作者</button>
            <button type="button" onclick="resetAuthorForm()" class="bg-slate-200 px-3 py-2 rounded text-xs">取消</button>
          </div>
        </form>
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 border-b pb-2">作者列表</h3>
          <div id="admin-list-authors" class="space-y-3">載入中...</div>
        </div>
      </div>
    </section>

    <!-- 本地出版社 -->
    <section id="tab-publishers" class="tab-content">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form id="form-publisher" onsubmit="savePublisher(event)" class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
          <h3 class="font-bold text-lg border-b pb-2" id="publisher-form-title">新增本地出版社</h3>
          <input type="hidden" id="pub-id">
          <div><label class="text-xs font-medium">出版社名稱 *</label><input type="text" id="pub-name" required class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">標誌 / 圖片 URL</label><input type="url" id="pub-image" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">聯絡電話</label><input type="text" id="pub-phone" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">官方網站 URL</label><input type="url" id="pub-website" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Instagram URL</label><input type="url" id="pub-ig" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Facebook URL</label><input type="url" id="pub-fb" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">簡介描述</label><textarea id="pub-desc" rows="4" class="w-full border rounded p-2 text-sm"></textarea></div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-amber-900 text-white font-bold py-2 rounded text-xs">儲存出版社</button>
            <button type="button" onclick="resetPublisherForm()" class="bg-slate-200 px-3 py-2 rounded text-xs">取消</button>
          </div>
        </form>
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 border-b pb-2">出版社列表</h3>
          <div id="admin-list-publishers" class="space-y-3">載入中...</div>
        </div>
      </div>
    </section>

    <!-- 網店商品 -->
    <section id="tab-products" class="tab-content">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form id="form-product" onsubmit="saveProduct(event)" class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
          <h3 class="font-bold text-lg border-b pb-2" id="prod-form-title">新增網店商品</h3>
          <input type="hidden" id="prod-id">
          <div><label class="text-xs font-medium">商品/書名 *</label><input type="text" id="prod-name" required class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">分類 *</label><input type="text" id="prod-category" required class="w-full border rounded px-3 py-1 text-sm" placeholder="例如：小說、Zine／雜誌"></div>
          <div><label class="text-xs font-medium">售價 (HK$) *</label><input type="number" id="prod-price" required class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">作者</label><input type="text" id="prod-author" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">譯者</label><input type="text" id="prod-translator" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">出版社</label><input type="text" id="prod-publisher" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">ISBN</label><input type="text" id="prod-isbn" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">重量 (g)</label><input type="number" id="prod-weight" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">總庫存數量 *</label><input type="number" id="prod-qty" required class="w-full border rounded px-3 py-1 text-sm" value="1"></div>
          <div><label class="text-xs font-medium">封面圖片 URL</label><input type="url" id="prod-image" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">書籍簡介</label><textarea id="prod-desc" rows="3" class="w-full border rounded p-2 text-sm"></textarea></div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-amber-900 text-white font-bold py-2 rounded text-xs">儲存商品</button>
            <button type="button" onclick="resetProductForm()" class="bg-slate-200 px-3 py-2 rounded text-xs">取消</button>
          </div>
        </form>
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 border-b pb-2">商品列表</h3>
          <div id="admin-list-products" class="space-y-3">載入中...</div>
        </div>
      </div>
    </section>

    <!-- 農業 / 環保 -->
    <section id="tab-eco" class="tab-content">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <form id="form-eco" onsubmit="saveEco(event)" class="bg-white p-6 rounded-xl shadow-sm border space-y-3">
          <h3 class="font-bold text-lg border-b pb-2" id="eco-form-title">新增農業/環保單位</h3>
          <input type="hidden" id="eco-id">
          <div><label class="text-xs font-medium">機構名稱 *</label><input type="text" id="eco-name" required class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">分類 *</label>
            <select id="eco-category" class="w-full border rounded px-3 py-1 text-sm bg-white">
              <option value="平台/大自然/教育">🌿 平台/大自然/教育</option>
              <option value="農地">👨‍🌾 農地</option>
              <option value="回收/環保">♻️ 回收/環保</option>
            </select>
          </div>
          <div><label class="text-xs font-medium">地址</label><input type="text" id="eco-address" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">電話</label><input type="text" id="eco-phone" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">官方網站 URL</label><input type="url" id="eco-website" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Facebook URL</label><input type="url" id="eco-fb" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">Instagram URL</label><input type="url" id="eco-ig" class="w-full border rounded px-3 py-1 text-sm"></div>
          <div><label class="text-xs font-medium">詳細介紹</label><textarea id="eco-desc" rows="4" class="w-full border rounded p-2 text-sm"></textarea></div>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-amber-900 text-white font-bold py-2 rounded text-xs">儲存單位</button>
            <button type="button" onclick="resetEcoForm()" class="bg-slate-200 px-3 py-2 rounded text-xs">取消</button>
          </div>
        </form>
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 border-b pb-2">農業/環保機構列表</h3>
          <div id="admin-list-eco" class="space-y-3">載入中...</div>
        </div>
      </div>
    </section>

    <!-- 劇團 -->
    <section id="tab-theatre" class="tab-content">

        address: document.getElementById('eco-address').value,
        phone: document.getElementById('eco-phone').value,
        website_url: document.getElementById('eco-website').value,
        facebook_url: document.getElementById('eco-fb').value,
        instagram_url: document.getElementById('eco-ig').value,
        description: document.getElementById('eco-desc').value
      };
      if (id) await _supabase.from('eco_farms').update(payload).eq('id', id);
      else await _supabase.from('eco_farms').insert([payload]);
      resetEcoForm();
      fetchEco();
    }

    function editEco(e) {
      document.getElementById('eco-form-title').innerText = "編輯農業/環保單位";
      document.getElementById('eco-id').value = e.id;
      document.getElementById('eco-name').value = e.name || '';
      document.getElementById('eco-category').value = e.category || '平台/大自然/教育';
      document.getElementById('eco-address').value = e.address || '';
      document.getElementById('eco-phone').value = e.phone || '';
      document.getElementById('eco-website').value = e.website_url || '';
      document.getElementById('eco-fb').value = e.facebook_url || '';
      document.getElementById('eco-ig').value = e.instagram_url || '';
      document.getElementById('eco-desc').value = e.description || '';
    }

    function resetEcoForm() {
      document.getElementById('eco-form-title').innerText = "新增農業/環保單位";
      document.getElementById('form-eco').reset();
      document.getElementById('eco-id').value = '';
    }

    async function deleteEco(id) {
      if (!confirm("確定刪除此農業/環保單位？")) return;
      await _supabase.from('eco_farms').delete().eq('id', id);
      fetchEco();
    }

    // --- 劇團 (對齊 Table: theatre_groups) ---
    async function fetchTheatre() {
      const el = document.getElementById('admin-list-theatre');
      const { data } = await _supabase.from('theatre_groups').select('*').order('id', { ascending: false });
      if (!data || data.length === 0) { el.innerHTML = `<p class="text-slate-400 italic text-xs">暫無紀錄。</p>`; return; }
      el.innerHTML = data.map(t => `
        <div class="border p-3 rounded-lg flex justify-between items-center text-xs bg-slate-50">
          <div>
            <span class="font-bold text-slate-800">${t.name}</span>
            <span class="ml-2 text-purple-800 font-semibold">(${t.region || '劇團'})</span>
            <p class="text-slate-400 mt-0.5">${t.address || '無地址'}</p>
          </div>
          <div class="flex space-x-2">
            <button onclick='editTheatre(${JSON.stringify(t).replace(/'/g, "&apos;")})' class="text-blue-600 hover:underline"><i class="fa-solid fa-pen"></i> 編輯</button>
            <button onclick="deleteTheatre(${t.id})" class="text-red-600 hover:underline"><i class="fa-solid fa-trash"></i> 刪除</button>
          </div>
        </div>
      `).join('');
    }

    async function saveTheatre(evt) {
      evt.preventDefault();
      const id = document.getElementById('theatre-id').value;
      const payload = {
        name: document.getElementById('theatre-name').value,
        region: document.getElementById('theatre-region').value,
        address: document.getElementById('theatre-address').value,
        phone: document.getElementById('theatre-phone').value,
        website_url: document.getElementById('theatre-website').value,
        facebook_url: document.getElementById('theatre-fb').value,
        instagram_url: document.getElementById('theatre-ig').value,
        description: document.getElementById('theatre-desc').value
      };
      if (id) await _supabase.from('theatre_groups').update(payload).eq('id', id);
      else await _supabase.from('theatre_groups').insert([payload]);
      resetTheatreForm();
      fetchTheatre();
    }

    function editTheatre(t) {
      document.getElementById('theatre-form-title').innerText = "編輯劇團";
      document.getElementById('theatre-id').value = t.id;
      document.getElementById('theatre-name').value = t.name || '';
      document.getElementById('theatre-region').value = t.region || '香港島';
      document.getElementById('theatre-address').value = t.address || '';
      document.getElementById('theatre-phone').value = t.phone || '';
      document.getElementById('theatre-website').value = t.website_url || '';
      document.getElementById('theatre-fb').value = t.facebook_url || '';
      document.getElementById('theatre-ig').value = t.instagram_url || '';
      document.getElementById('theatre-desc').value = t.description || '';
    }

    function resetTheatreForm() {
      document.getElementById('theatre-form-title').innerText = "新增劇團";
      document.getElementById('form-theatre').reset();
      document.getElementById('theatre-id').value = '';
    }

    async function deleteTheatre(id) {
      if (!confirm("確定刪除此劇團記錄？")) return;
      await _supabase.from('theatre_groups').delete().eq('id', id);
      fetchTheatre();
    }
  </script>
</body>
</html>
