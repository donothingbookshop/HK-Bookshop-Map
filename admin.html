<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獨立書店地圖 - 後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

  <!-- 頂部導航 -->
  <header class="bg-amber-950 text-amber-50 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-gear text-amber-400 text-xl"></i>
        <h1 class="text-lg font-bold tracking-wide">後台管理系統</h1>
      </div>
      <a href="index.html" class="text-xs bg-amber-800 hover:bg-amber-700 px-3 py-1.5 rounded-lg transition">返回前台首頁 ↗</a>
    </div>
  </header>

  <!-- 登入區塊 (如果未登入會顯示) -->
  <div id="login-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full">
      <h2 class="text-xl font-bold mb-4 text-center text-amber-950"><i class="fa-solid fa-lock mr-2"></i>管理員登入</h2>
      <div class="space-y-3">
        <input type="email" id="login-email" placeholder="Email" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-800 outline-none">
        <input type="password" id="login-password" placeholder="Password" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-800 outline-none">
        <button onclick="handleLogin()" class="w-full bg-amber-900 text-white py-2.5 rounded-lg font-medium hover:bg-amber-800 transition text-sm">登入系統</button>
      </div>
    </div>
  </div>

  <!-- 後台主要內容 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- 分頁選單 -->
    <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-3">
      <button onclick="switchTab('bookshops')" class="tab-btn active bg-amber-900 text-white px-3.5 py-2 rounded-lg text-xs font-medium transition">🏪 實體書店</button>
      <button onclick="switchTab('authors')" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">✍️ 獨立作者</button>
      <button onclick="switchTab('publishers')" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🏛️ 獨立出版社</button>
      <button onclick="switchTab('products')" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🛒 網店商品</button>
      <button onclick="switchTab('eco')" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🌱 農業/環保</button>
      <button onclick="switchTab('theatre')" class="tab-btn bg-white hover:bg-amber-50 px-3.5 py-2 rounded-lg text-xs font-medium border transition">🎭 劇團</button>
      <button onclick="handleLogout()" class="ml-auto bg-red-100 text-red-700 hover:bg-red-200 px-3.5 py-2 rounded-lg text-xs font-medium transition">登出</button>

    <!-- 1. 實體書店管理 -->
    <section id="tab-bookshops" class="tab-content active">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <form id="form-bookshop" onsubmit="saveBookshop(event)" class="bg-white p-6 rounded-xl shadow-sm border space-y-4">

          <input type="hidden" id="bs-id">
          <div><label class="block text-xs font-medium text-slate-600 mb-1">名稱 *</label><input type="text" id="bs-name" required class="w-full border rounded px-3 py-1.5 text-sm"></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-xs font-medium text-slate-600 mb-1">地區 *</label>
              <select id="bs-region" class="w-full border rounded px-3 py-1.5 text-sm">
                <option value="香港島">香港島</option><option value="九龍">九龍</option><option value="新界">新界</option><option value="離島">離島</option>
                <option value="外國香港書店/圖書館">外國香港書店/圖書館</option><option value="已結業書店">已結業書店</option>
              </select>

          <div><label class="block text-xs font-medium text-slate-600 mb-1">營業時間</label><input type="text" id="bs-hours" placeholder="例: 12:00 - 20:00" class="w-full border rounded px-3 py-1.5 text-sm"></div>
          <div><label class="block text-xs font-medium text-slate-600 mb-1">Google Map 連結</label><input type="url" id="bs-map" class="w-full border rounded px-3 py-1.5 text-sm"></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block text-xs font-medium text-slate-600 mb-1">Instagram URL</label><input type="url" id="bs-ig" class="w-full border rounded px-3 py-1.5 text-sm"></div>
            <div><label class="block text-xs font-medium text-slate-600 mb-1">Facebook URL</label><input type="url" id="bs-fb" class="w-full border rounded px-3 py-1.5 text-sm"></div>
          </div>
          <div><label class="block text-xs font-medium text-slate-600 mb-1">圖片 URL</label><input type="url" id="bs-image" class="w-full border rounded px-3 py-1.5 text-sm"></div>
          <div><label class="block text-xs font-medium text-slate-600 mb-1">簡介描述</label><textarea id="bs-desc" rows="3" class="w-full border rounded px-3 py-1.5 text-sm"></textarea></div>

    <!-- 4. 網店商品管理 -->

            <div><label class="block text-xs font-medium text-slate-600 mb-1">價格 (HK$) *</label><input type="number" id="prod-price" required class="w-full border rounded px-3 py-1.5 text-sm"></div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yteeedyldfemxmvvylem.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZWVlZHlsZGZlbXhtdnZ5bGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTI3MzUsImV4cCI6MjEwMzkyODczNX0.Ri7wQQpUJMvqs44jixOD1rU7cP2vt-dKQmSIhrDKAdE';

    // 初始化 Supabase 並開啟持久化 Session 防止頻繁自動登出
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let currentTab = 'bookshops';
    let cacheData = {};

    window.onload = async function() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        document.getElementById('login-overlay').classList.add('hidden');
        loadTabContent(currentTab);
      }
    };

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) alert("登入失敗：" + error.message);
      else { document.getElementById('login-overlay').classList.add('hidden'); loadTabContent(currentTab); }
    }

    async function handleLogout() {
      await _supabase.auth.signOut();
      location.reload();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-amber-900', 'text-white');
        btn.classList.add('bg-white');
      });
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.currentTarget.classList.remove('bg-white');
      event.currentTarget.classList.add('bg-amber-900', 'text-white');
      loadTabContent(tab);
    }

    function loadTabContent(tab) {
      if (tab === 'bookshops') fetchBookshops();
      else if (tab === 'authors') fetchAuthors();

    async function deleteRecord(table, id) {
      if (!confirm("確定要刪除此筆紀錄？此動作無法復原！")) return;

      if (error) alert("刪除失敗：" + error.message);
      else { alert("✅ 已順利刪除"); loadTabContent(currentTab); }
    }

    function resetForm(type) {
      document.getElementById(`form-${type}`).reset();
      const idInput = document.getElementById(`${type === 'bookshop' ? 'bs' : type === 'author' ? 'au' : type === 'publisher' ? 'pub' : type === 'product' ? 'prod' : type === 'theatre' ? 'th' : 'eco'}-id`);
      if (idInput) idInput.value = '';
      const titleElem = document.getElementById(`${type}-form-title`);
      if (titleElem) titleElem.innerText = `新增${type === 'bookshop' ? '實體書店/圖書館' : type === 'author' ? '獨立作者' : type === 'publisher' ? '獨立出版社' : type === 'product' ? '網店商品' : type === 'theatre' ? '劇團' : '農業/環保單位'}`;
